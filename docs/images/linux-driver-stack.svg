<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #24292f; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #57606a; }
      .comp-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #24292f; }
      .comp-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; fill: #57606a; }
      .tag-impl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; fill: #1a7f37; }
      .tag-part { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; fill: #9a6700; }
      .tag-plan { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; fill: #57606a; }
    </style>
    <filter id="shadow" x="-2%" y="-3%" width="104%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.05" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#f6f8fa" rx="8" />

  <text x="36" y="38" class="title">Linux Platform Driver Stack (edu_device)</text>
  <text x="36" y="56" class="subtitle">Detailed Subsystem &amp; Architectural Component Decomposition</text>

  <!-- Top-level: Userspace ABI -->
  <g transform="translate(36, 75)" filter="url(#shadow)">
    <rect width="808" height="65" rx="6" fill="#ffffff" stroke="#2da44e" stroke-width="1.2" />
    <rect x="12" y="10" width="85" height="18" rx="3" fill="#dafbe1" />
    <text x="18" y="23" class="tag-impl">IMPLEMENTED</text>
    <text x="110" y="24" class="comp-title">Userspace Character Device ABI (/dev/edu0)</text>
    <text x="12" y="48" class="comp-sub">cdev registration, dynamic dev_t allocation, file_operations: open(), release(), read(), write(), poll(), unlocked_ioctl()</text>
  </g>

  <!-- Mid-level: Core Driver Subsystems (4 Cards) -->
  <g transform="translate(36, 155)">
    <!-- Card 1: State & Ring-Buffer -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="190" height="150" rx="6" fill="#ffffff" stroke="#2da44e" stroke-width="1.2" />
      <rect x="10" y="10" width="85" height="18" rx="3" fill="#dafbe1" />
      <text x="16" y="23" class="tag-impl">IMPLEMENTED</text>
      <text x="10" y="46" class="comp-title">Buffer &amp; State</text>
      <text x="10" y="66" class="comp-sub">&#x2022; Software ring buffer</text>
      <text x="10" y="82" class="comp-sub">&#x2022; Depth: 256 words</text>
      <text x="10" y="98" class="comp-sub">&#x2022; Spinlock synchronization</text>
      <text x="10" y="114" class="comp-sub">&#x2022; Mutex for cdev I/O</text>
      <text x="10" y="130" class="comp-sub">&#x2022; wait_queue for blocking</text>
    </g>

    <!-- Card 2: Interrupt Architecture -->
    <g transform="translate(206, 0)" filter="url(#shadow)">
      <rect width="190" height="150" rx="6" fill="#ffffff" stroke="#2da44e" stroke-width="1.2" />
      <rect x="10" y="10" width="85" height="18" rx="3" fill="#dafbe1" />
      <text x="16" y="23" class="tag-impl">IMPLEMENTED</text>
      <text x="10" y="46" class="comp-title">Interrupt Framework</text>
      <text x="10" y="66" class="comp-sub">&#x2022; Top-half handler</text>
      <text x="10" y="82" class="comp-sub">&#x2022; request_irq (SPI 12)</text>
      <text x="10" y="98" class="comp-sub">&#x2022; Bottom-half workqueue</text>
      <text x="10" y="114" class="comp-sub">&#x2022; IRQ statistics tracker</text>
      <text x="10" y="130" class="comp-sub">&#x2022; Status clear / ACK logic</text>
    </g>

    <!-- Card 3: Diagnostics & Power -->
    <g transform="translate(412, 0)" filter="url(#shadow)">
      <rect width="190" height="150" rx="6" fill="#ffffff" stroke="#2da44e" stroke-width="1.2" />
      <rect x="10" y="10" width="85" height="18" rx="3" fill="#dafbe1" />
      <text x="16" y="23" class="tag-impl">IMPLEMENTED</text>
      <text x="10" y="46" class="comp-title">Sysfs, Debugfs &amp; PM</text>
      <text x="10" y="66" class="comp-sub">&#x2022; sysfs: status, version</text>
      <text x="10" y="82" class="comp-sub">&#x2022; debugfs: irq_count</text>
      <text x="10" y="98" class="comp-sub">&#x2022; debugfs: fault_inject</text>
      <text x="10" y="114" class="comp-sub">&#x2022; Fault recovery hook</text>
      <text x="10" y="130" class="comp-sub">&#x2022; Dev PM suspend/resume</text>
    </g>

    <!-- Card 4: MMIO Register Layer -->
    <g transform="translate(618, 0)" filter="url(#shadow)">
      <rect width="190" height="150" rx="6" fill="#ffffff" stroke="#bf8700" stroke-width="1.2" />
      <rect x="10" y="10" width="85" height="18" rx="3" fill="#fff8c5" />
      <text x="18" y="23" class="tag-part">PARTIAL</text>
      <text x="10" y="46" class="comp-title" fill="#7d4e00">MMIO Register Layer</text>
      <text x="10" y="66" class="comp-sub">&#x2022; devm_ioremap_resource()</text>
      <text x="10" y="82" class="comp-sub">&#x2022; edu_reg_read32() wrapper</text>
      <text x="10" y="98" class="comp-sub">&#x2022; edu_reg_write32() wrapper</text>
      <text x="10" y="114" class="comp-sub" fill="#bf8700">&#x26A0; HW register mapping</text>
      <text x="10" y="130" class="comp-sub" fill="#bf8700">&#x26A0; End-to-end access in dev</text>
    </g>
  </g>

  <!-- Platform Bus Layer -->
  <g transform="translate(36, 320)" filter="url(#shadow)">
    <rect width="808" height="65" rx="6" fill="#ffffff" stroke="#2da44e" stroke-width="1.2" />
    <rect x="12" y="10" width="85" height="18" rx="3" fill="#dafbe1" />
    <text x="18" y="23" class="tag-impl">IMPLEMENTED</text>
    <text x="110" y="24" class="comp-title">Linux Platform Bus Integration (platform_driver)</text>
    <text x="12" y="48" class="comp-sub">platform_driver probe() / remove(), of_match_table with compatible "edu,device-v1", platform_get_resource(), platform_get_irq()</text>
  </g>

  <!-- Bottom-level: Target Hardware Boundary -->
  <g transform="translate(36, 400)" filter="url(#shadow)">
    <rect width="808" height="95" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="4 4" />
    <rect x="12" y="10" width="75" height="18" rx="3" fill="#eaeef2" />
    <text x="18" y="23" class="tag-plan">PLANNED</text>
    <text x="100" y="24" class="comp-title" fill="#57606a">Hardware Interface Boundary (Target EDU Peripheral in QEMU)</text>
    <text x="12" y="46" class="comp-sub">&#x2022; MMIO Base: 0x20000000 (Size: 0x1000) &#x2022; Interrupt: GIC SPI 12 Level-High &#x2022; FIFO: 128 words hardware queue</text>
    <text x="12" y="64" class="comp-sub">&#x2022; Registers: CONTROL (0x00), STATUS (0x04), DATA (0x08), IRQ_STATUS (0x0C), IRQ_ENABLE (0x10), VERSION (0x14), FIFO_LEVEL (0x18), ERROR_STATUS (0x1C)</text>
    <text x="12" y="82" class="comp-sub" fill="#cf222e">* Note: Target hardware contract defined in docs/edu-device-spec.md; QEMU hardware model is a planned next phase.</text>
  </g>
</svg>